services:
  cassandra:
    image: cassandra:5.0.9
    container_name: cassandra-lab
    restart: unless-stopped
    ports:
      - "127.0.0.1:9042:9042"
    volumes:
      - cassandra-data:/var/lib/cassandra
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'describe keyspaces' || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s

volumes:
  cassandra-data:
